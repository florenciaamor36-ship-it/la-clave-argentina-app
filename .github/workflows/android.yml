name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Fix gradle wrapper jar
      run: |
        mkdir -p gradle/wrapper
        curl -L https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar

    - name: Restore missing ProtocolHandler.kt
      run: |
        mkdir -p app/src/main/java/com/aerovpn/service/protocol
        curl -L https://raw.githubusercontent.com/0xgetz/AeroVPN/main/app/src/main/java/com/aerovpn/service/protocol/ProtocolHandler.kt -o app/src/main/java/com/aerovpn/service/protocol/ProtocolHandler.kt

    - name: Create missing resources
      run: |
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/xml
        mkdir -p app/src/main/res/mipmap-mdpi
        
        # Create themes.xml with AppCompat fallback
        echo '<?xml version="1.0" encoding="utf-8"?><resources><style name="Theme.AeroVPN" parent="Theme.AppCompat.Light.NoActionBar" /></resources>' > app/src/main/res/values/themes.xml
        
        # Create dummy icons
        curl -L https://github.com/google/material-design-icons/raw/master/png/action/lock/materialicons/24dp/1x/baseline_lock_black_24dp.png -o app/src/main/res/mipmap-mdpi/ic_launcher.png
        cp app/src/main/res/mipmap-mdpi/ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher_round.png
        
        # Create XML resources
        echo '<?xml version="1.0" encoding="utf-8"?><paths><external-path name="my_images" path="Pictures/" /></paths>' > app/src/main/res/xml/file_paths.xml
        echo '<?xml version="1.0" encoding="utf-8"?><network-security-config><base-config cleartextTrafficPermitted="true"><trust-anchors><certificates src="system" /><certificates src="user" /></trust-anchors></base-config></network-security-config>' > app/src/main/res/xml/network_security_config.xml
        echo '<?xml version="1.0" encoding="utf-8"?><data-extraction-rules><cloud-backup><include domain="file" path="."/></cloud-backup><device-transfer><include domain="file" path="."/></device-transfer></data-extraction-rules>' > app/src/main/res/xml/data_extraction_rules.xml
        echo '<?xml version="1.0" encoding="utf-8"?><full-backup-content></full-backup-content>' > app/src/main/res/xml/backup_rules.xml

    - name: Fix syntax errors in source
      run: |
        python3 -c "
        import os
        path = 'app/src/main/java/com/aerovpn/ui/screens/HomeScreen.kt'
        if os.path.exists(path):
            content = open(path).read()
            open_b = content.count('{')
            close_b = content.count('}')
            if open_b > close_b:
                with open(path, 'a') as f: f.write('\n' + '}' * (open_b - close_b) + '\n')
                print(f'Fixed {open_b - close_b} missing braces in HomeScreen.kt')
        "

    - name: Simplify AeroVpnService.kt to SSH only
      run: |
        python3 -c "
        import os
        path = 'app/src/main/java/com/aerovpn/service/AeroVpnService.kt'
        if not os.path.exists(path): exit(0)
        content = open(path).read()
        lines = content.split('\n')
        new_lines = []
        for line in lines:
            if 'import com.aerovpn.service.protocol.' in line and not any(x in line for x in ['ProtocolHandler', 'SSHProtocol', 'SSHConfig', 'ProtocolConfig', 'ProtocolType', 'ConnectionState']):
                new_lines.append('// ' + line)
            else:
                new_lines.append(line)
        content = '\n'.join(new_lines)
        import re
        content = re.sub(r'is WireGuardConfig -> WireGuardProtocol\(\)', '// Removed WireGuard', content)
        content = re.sub(r'is V2RayConfig -> V2RayProtocol\(this\)', '// Removed V2Ray', content)
        content = re.sub(r'is ShadowsocksConfig -> ShadowsocksProtocol\(this\)', '// Removed Shadowsocks', content)
        content = re.sub(r'is UdpTunnelConfig -> UdpTunnelProtocol\(this\)', '// Removed UdpTunnel', content)
        open(path, 'w').write(content)
        "

    - name: Fix app build.gradle dependencies
      run: |
        sed -i 's/1.0.20230705/1.0.20230427/g' app/build.gradle
        sed -i "s/implementation 'com.github.2dust:v2rayNG:1.8.19'/\/\/ implementation 'com.github.2dust:v2rayNG:1.8.19'/g" app/build.gradle
        sed -i "s/implementation 'com.github.2dust:v2rayNG:1.5.16'/\/\/ implementation 'com.github.2dust:v2rayNG:1.5.16'/g" app/build.gradle
        
        # Add AppCompat and Material dependencies explicitly
        sed -i "/dependencies {/a \    implementation 'androidx.appcompat:appcompat:1.6.1'" app/build.gradle
        sed -i "/dependencies {/a \    implementation 'com.google.android.material:material:1.11.0'" app/build.gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: la-clave-argentina-debug
        path: app/build/outputs/apk/debug/*.apk
